# =============================================================================
# Document registry — single source of truth for the corpus (Design §4.1)
# Project : dsm-regulation-assistant
# Version : 1.1   Date: 2026-11-04   (1.1: CR-2 Batch A — Grid Code, Ancillary Services, GNA, Power Market)
# Source  : cercind.gov.in — "Current Regulations" and "Draft Regulation" pages
#
# Field guide
#   doc_id          stable id used in citations (never rename once indexed)
#   doc_type        principal | amendment | draft | sor | em | order | procedure | effective_notice
#   status          final | superseded | draft
#   regime          dsm-2022 | dsm-2024 | iegc-2023 | as-2022 | gna-2022 | pmr-2021
#                   (which family of regulations it belongs to)
#   notified_date   date on the notification / order (YYYY-MM-DD, null if unknown)
#   effective_from  date the text starts to apply (null for drafts and explanatory docs)
#   effective_to    date it stops applying (null = still in force)
#   amends          doc_id of the regulation this document changes
#   tier            core (must index) | history | drafts | reference
#   include         true/false — whether notebook 04 indexes it
#   url             official PDF link (the notebook tries case variants if it 404s)
#   notes           anything a reviewer should know
#
# Text source rule: we index the "Notification" PDF, not the "Gazette" PDF.
# Same legal text, but Gazette copies add Hindi pages and scan artefacts.
# =============================================================================

documents:

